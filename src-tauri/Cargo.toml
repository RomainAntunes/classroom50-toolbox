[package]
name = "classroom50-toolbox"
version = "0.14.1"
description = "Tray toolbox for Classroom 50 students"
authors = ["Romain Antunes"]
license = "GPL-3.0-only"
repository = "https://github.com/RomainAntunes/classroom50-toolbox"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "classroom50_toolbox_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "macos-private-api"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_norway = "0.9"
thiserror = "2"
tokio = { version = "1", features = ["process", "fs", "time", "macros", "sync", "rt", "net"] }
futures-util = { version = "0.3", default-features = false }
reqwest = { version = "0.13", features = ["json"] }
chrono = { version = "0.4", features = ["serde"] }
walkdir = "2"
base64 = "0.22"
notify = "8"
sha2 = "0.10"
log = "0.4"
tauri-plugin-notification = "2.7"
tauri-plugin-process = "2"
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
sys-locale = "0.3"
tauri-plugin-clipboard-manager = "2.5"


# Typed IPC bindings (`src/lib/bindings.ts`), generated and checked by the `bindings` test only:
# nothing of it is compiled into the app. Specta 2 is still a release candidate, so pin it.
[dev-dependencies]
specta = { version = "=2.0.0-rc.25", features = ["derive", "function", "chrono"] }
specta-typescript = "=0.0.12"
tauri-specta = { version = "=2.0.0-rc.25", features = ["typescript"] }

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-autostart = "2"
tauri-plugin-deep-link = "2.6"
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
tauri-plugin-updater = "2.14"
tauri-plugin-global-shortcut = "2"

[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
window-vibrancy = "0.8"

[target.'cfg(target_os = "windows")'.dependencies]
windows-registry = "0.6"

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
objc2 = "0.6"
objc2-event-kit = { version = "0.3", default-features = false, features = ["std", "block2", "objc2-core-graphics", "EKCalendar", "EKCalendarItem", "EKEvent", "EKEventStore", "EKAlarm", "EKObject", "EKSource", "EKTypes"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "block2", "NSArray", "NSDate", "NSDateFormatter", "NSError", "NSFormatter", "NSLocale", "NSString", "NSURL", "NSObject"] }
objc2-service-management = { version = "0.3", default-features = false, features = ["std", "SMAppService"] }

# tauri-plugin-deep-link 2.6.2 builds rust-ini's ParseOption with the two fields it had
# before 0.21.2, so a newer rust-ini fails to compile it on Linux. Drop once the plugin
# catches up.
[target.'cfg(target_os = "linux")'.dependencies]
rust-ini = "=0.21.1"
