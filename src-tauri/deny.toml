# cargo-deny: `cargo deny check` from src-tauri/ (CI's `deny` job).
# https://embarkstudios.github.io/cargo-deny/

[graph]
# Every platform the app ships on, so a crate pulled in by one OS only is checked too.
targets = [
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "x86_64-pc-windows-msvc",
    "aarch64-pc-windows-msvc",
]
all-features = false

[advisories]
# RustSec advisories, including unmaintained and unsound crates. A finding fails the check
# unless it is listed below with the reason it doesn't apply or can't be fixed yet.
version = 2
yanked = "deny"
# Each entry: why it doesn't apply or can't be fixed from here, and when to drop it.
ignore = [
    # paste (unmaintained) comes only with specta, a dev-dependency used by the
    # `bindings_are_current` test to generate src/lib/bindings.ts; the app never compiles it.
    # Drop this once specta no longer depends on paste.
    { id = "RUSTSEC-2024-0436", reason = "dev-only, via specta for the IPC bindings test; never built into the app" },
    # proc-macro-error (unmaintained) is a build-time dependency of glib-macros 0.18, the
    # gtk-rs generation Tauri's Linux webview (webkit2gtk 2.0, tao, wry, muda) is built on.
    # Nothing to do until Tauri moves to a newer gtk stack.
    { id = "RUSTSEC-2024-0370", reason = "build-time only, via gtk-rs 0.18 under Tauri's Linux stack; no upgrade available from this app" },
    # zbus_names, zvariant and zvariant_derive (unmaintained) were merged into zbus 6. They
    # come with zbus 5, used by tauri-plugin-notification (notify-rust), -opener and
    # -single-instance on Linux. Drop these once those plugins move to zbus 6.
    { id = "RUSTSEC-2026-0371", reason = "zbus 5 dependency of Tauri plugins; merged into zbus 6, not a vulnerability" },
    { id = "RUSTSEC-2026-0370", reason = "zbus 5 dependency of Tauri plugins; merged into zbus 6, not a vulnerability" },
    { id = "RUSTSEC-2026-0372", reason = "zbus 5 dependency of Tauri plugins; merged into zbus 6, not a vulnerability" },
    # zip < 9 extraction flaws (SUID/SGID bits kept, symlinks escaping the destination,
    # permissions applied through symlinks). zip 4 is only built on Windows, by
    # tauri-plugin-updater, which extracts an update only when the payload is a zip, and only
    # after checking its signature against the app's updater key. The app's updater artifacts
    # are plain .exe and .msi files, so no zip is ever extracted, and the flaws are about Unix
    # permissions and symlinks. The plugin's main branch already uses zip 9: drop these once a
    # tauri-plugin-updater release ships it.
    { id = "RUSTSEC-2026-0367", reason = "Windows-only zip 4 in tauri-plugin-updater; signed .exe/.msi payloads, never a zip; fixed upstream, not released" },
    { id = "RUSTSEC-2026-0368", reason = "Windows-only zip 4 in tauri-plugin-updater; signed .exe/.msi payloads, never a zip; fixed upstream, not released" },
    { id = "RUSTSEC-2026-0369", reason = "Windows-only zip 4 in tauri-plugin-updater; signed .exe/.msi payloads, never a zip; fixed upstream, not released" },
]

[licenses]
version = 2
# The app is GPL-3.0-only, so everything it links must be compatible with shipping it under
# GPL-3.0: permissive licenses, MPL-2.0 (file-level copyleft, GPL-3.0 compatible) or GPL-3.0
# itself (the app). Licenses that conflict with GPL-3.0 (OpenSSL, SSPL, BUSL, CDDL, EPL-1.0,
# the "non-commercial" family) are left out on purpose. Only licenses the tree actually uses
# are listed; a new one fails the check until it is reviewed and added here.
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "GPL-3.0-only",
    "ISC",
    "MIT",
    "MIT-0",
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.9

[bans]
# Duplicate versions come from Tauri's own tree (gtk-rs 0.18, windows-sys generations,
# toml/winnow/syn majors) and can't be fixed from here: warn, don't fail.
multiple-versions = "warn"
wildcards = "deny"
# The local crate has no version on crates.io to pin to.
allow-wildcard-paths = true

[sources]
# crates.io only: no git dependencies, no other registries.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
