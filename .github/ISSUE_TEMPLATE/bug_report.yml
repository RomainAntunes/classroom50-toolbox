name: Bug report
description: Something in the app doesn't work as it should.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report this. If `gh student` fails the same way in a terminal, the problem is upstream: please report it to [foundation50/classroom50](https://github.com/foundation50/classroom50/issues) instead.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What you did, what you expected, and what happened instead. Quote any error message.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open the toolbox from the tray
        2. Right-click an assignment and choose ...
        3. ...
    validations:
      required: false
  - type: input
    id: version
    attributes:
      label: App version
      description: Shown in Settings > About.
      placeholder: 0.11.0
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - macOS
        - Windows
        - Linux
    validations:
      required: true
  - type: input
    id: os-version
    attributes:
      label: OS version and desktop
      description: For example macOS 26.1, Windows 11 24H2, or Ubuntu 24.04 with GNOME.
    validations:
      required: false
  - type: dropdown
    id: install
    attributes:
      label: How did you install it?
      options:
        - macOS .dmg
        - Windows setup .exe
        - Windows .msi
        - Linux .AppImage
        - Linux .deb
        - Linux .rpm
        - Built from source
    validations:
      required: false
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics
      description: |
        In the app, open Settings > About > Copy diagnostics and paste the report here. Accounts, classes, repositories, emails and your home folder are already replaced with placeholders, but read it before you post it.
    validations:
      required: false
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots
      description: Drag images here if they help. Hide anything private, such as class or classmate names.
    validations:
      required: false
  - type: checkboxes
    id: checks
    attributes:
      label: Before you submit
      options:
        - label: I'm on the latest version, or the bug still happens after updating.
          required: false
        - label: Nothing I pasted holds a token, a password or someone else's personal data.
          required: true
