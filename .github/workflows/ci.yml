name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, labeled]

# A label other than `run-ci` starts a run whose jobs all skip; its own group keeps it from
# cancelling a real run of the same PR.
concurrency:
  group: ci-${{ github.ref }}${{ github.event.action == 'labeled' && github.event.label.name != 'run-ci' && format('-{0}', github.run_id) || '' }}
  cancel-in-progress: true

# Every job only reads the repository; none needs a token that can write.
permissions: {}

jobs:
  # Dependabot's PRs run nothing until the `run-ci` label is added (then every push to them
  # runs). Other PRs and pushes to main always run; adding `run-ci` to one runs it again.
  # A version bump alone (or a changelog edit) is scope `bump`: its code is the commit
  # before's, already checked, so only `release-inputs` runs. Adding `run-ci` checks it all.
  gate:
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.action == 'labeled' && github.event.label.name == 'run-ci') ||
      (github.event.action != 'labeled' &&
        (github.event.pull_request.user.login != 'dependabot[bot]' ||
          contains(github.event.pull_request.labels.*.name, 'run-ci')))
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      scope: ${{ steps.scope.outputs.scope }}
    steps:
      # A PR's merge commit or main's new merge: its first parent is the base.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      # Compared with the first parent, unless a push brought several commits.
      - id: scope
        env:
          EVENT: ${{ github.event_name }}
          ACTION: ${{ github.event.action }}
          BEFORE: ${{ github.event.before }}
        run: |
          base=$(git rev-parse --verify --quiet HEAD^1 || true)
          if [ -z "$base" ] || [ "$ACTION" = labeled ] || { [ "$EVENT" = push ] && [ "$BEFORE" != "$base" ]; }; then
            scope=full
          else
            scope=$(node scripts/ci-scope.mjs "$base") || scope=full
          fi
          echo "scope: $scope"
          echo "scope=$scope" >> "$GITHUB_OUTPUT"

  # Scope `bump`: what the release reads. The versions agree (Cargo.lock refreshed), the
  # changelogs are formatted and complete in every catalog (changelog.test.ts), and the
  # bundle, which holds every changelog, still fits its size budget.
  release-inputs:
    needs: gate
    if: needs.gate.outputs.scope == 'bump'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node scripts/ci-scope.mjs --versions
      - run: pnpm exec prettier --check package.json src/lib/changelog
      - run: pnpm exec vitest run src/lib/changelog scripts
      - run: pnpm build
      - name: Bundle size budget
        run: node scripts/size-budget.mjs build

  check:
    needs: gate
    if: needs.gate.outputs.scope == 'full'
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
          cache: pnpm
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: clippy, rustfmt
      - uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm test
      # tauri::generate_context! embeds the built frontend, so it must exist before cargo runs.
      - run: pnpm build
      # The webview bundle against scripts/size-budget.json; the table goes to the summary.
      - name: Bundle size budget
        if: runner.os == 'Linux'
        run: node scripts/size-budget.mjs build
      - run: cargo fmt --check
        working-directory: src-tauri
      - run: cargo clippy --all-targets -- -D warnings
        working-directory: src-tauri
      - run: cargo test
        working-directory: src-tauri

  # The WebDriver smoke suite (e2e/): the real app, a debug build, against a mock GitHub and
  # a fake gh. Linux only: tauri-driver needs WebKitWebDriver, and macOS has no WKWebView driver.
  webdriver:
    needs: gate
    if: needs.gate.outputs.scope == 'full'
    permissions:
      contents: read
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: System dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf \
            webkit2gtk-driver xvfb dbus

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            e2e/pnpm-lock.yaml
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      # Its own key: a debug build of the app, plus tauri-driver in ~/.cargo/bin.
      - uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri
          key: webdriver

      - name: Install tauri-driver
        run: cargo install tauri-driver --locked
      - run: pnpm install --frozen-lockfile
      - run: pnpm install --frozen-lockfile
        working-directory: e2e
      # Debug, so the dev write guard and the test hooks are in; the frontend is embedded.
      - run: pnpm tauri build --debug --no-bundle

      # The single-instance plugin needs a session bus, the webview a display.
      - name: Smoke tests
        run: dbus-run-session -- xvfb-run --auto-servernum --server-args="-screen 0 1280x1024x24" pnpm test
        working-directory: e2e

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: webdriver-artifacts
          path: e2e/artifacts
          if-no-files-found: ignore

  # Rust line coverage, report only: a per-file table (least covered first) in the run's
  # summary. No upload to a coverage service and no threshold; failing tests fail `check`.
  coverage:
    needs: gate
    if: needs.gate.outputs.scope == 'full'
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    continue-on-error: true
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
          cache: pnpm
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: llvm-tools-preview
      # Its own key: an instrumented build shares nothing with the other jobs.
      - uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri
          key: coverage
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-llvm-cov

      - run: pnpm install --frozen-lockfile
      # tauri::generate_context! embeds the built frontend.
      - run: pnpm build
      - name: Coverage
        run: cargo llvm-cov --json --summary-only --output-path coverage.json
        working-directory: src-tauri
      - name: Summary
        working-directory: src-tauri
        run: |
          {
            echo "## Rust coverage"
            echo
            jq -r -f ../scripts/coverage-summary.jq coverage.json
          } >> "$GITHUB_STEP_SUMMARY"

  # UI flows in WebKit with Rust faked (tests/e2e): no app build, no GitHub access.
  e2e:
    needs: gate
    if: needs.gate.outputs.scope == 'full'
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Playwright version
        id: playwright
        run: echo "version=$(pnpm exec playwright --version | cut -d' ' -f2)" >> "$GITHUB_OUTPUT"
      - name: Cache the browser
        id: browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-webkit-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - name: Install WebKit
        if: steps.browsers.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps webkit
      - name: WebKit's system libraries
        if: steps.browsers.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps webkit

      - run: pnpm test:e2e

      - name: Upload the report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14

  # Rust dependencies: RustSec advisories, licenses compatible with GPL-3.0, crates.io only
  # (src-tauri/deny.toml). Advisories run apart and don't block: a new advisory against a
  # crate deep in Tauri's tree would otherwise fail every PR until upstream ships a fix.
  deny:
    needs: gate
    if: needs.gate.outputs.scope == 'full'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        checks: [advisories, bans licenses sources]
    continue-on-error: ${{ matrix.checks == 'advisories' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          manifest-path: src-tauri/Cargo.toml
          # The action passes --all-features by default, over deny.toml's `all-features =
          # false`; empty, CI checks the same graph as a local `cargo deny check`.
          arguments: ""
          command: check ${{ matrix.checks }}

  # Static analysis of the workflows themselves (unpinned actions, token permissions,
  # template injection...). Findings go to the log, not to code scanning.
  zizmor:
    needs: gate
    if: needs.gate.outputs.scope == 'full'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: zizmorcore/zizmor-action@85b2b9fb8e3325e7a23d7d0a9d7ba5ae0f999e3e # v0.7.1
        with:
          advanced-security: false
