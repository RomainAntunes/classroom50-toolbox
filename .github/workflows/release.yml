  #           # Same check as the download: only the installers that went to SignPath.
  #           cmp -s "$file" "unsigned/$(basename "$file")" && { echo "::error::$file came back unsigned"; exit 1; }
  #           rm -f "$file.sig"
  #           pnpm tauri signer sign --app-version "$VERSION" "$file"
  #           tail=/$(jq -rn --arg name "$(basename "$file")" '$name | @uri')
  #           jq --arg tail "$tail" --rawfile sig "$file.sig" '
  #             if ([.platforms[] | select(.url | endswith($tail))] | length) == 0
  #             then error("no feed entry for \($tail)") else . end
