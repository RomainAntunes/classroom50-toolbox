  #       env:
  #         GH_TOKEN: ${{ github.token }}
  #         TAG: v${{ needs.version.outputs.version }}
  #       run: |
  #         gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir unsigned \
  #           --pattern '*-setup.exe' --pattern '*.msi'
  #         ls -l unsigned
  #     - id: unsigned
  #       uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
  #       with:
  #         name: windows-unsigned
  #         path: unsigned/
  #         if-no-files-found: error
  #     # Waits for the signing request to be approved in SignPath (approval is manual), up to
  #     # just under the 6 hours a GitHub-hosted job may run.
  #     - uses: signpath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092 # v3.0
  #       with:
  #         api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
  #         organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
