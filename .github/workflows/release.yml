name: Release

# Runs on every merge into main, but only builds when package.json carries a version that
# has no release yet (bump it in the PR with `pnpm bump X.Y.Z`). The result is a draft
# release with installers and latest.json; publishing the draft ships the update to
# installed apps. A version like 0.11.0-beta.1 makes a draft pre-release instead, without
# the MSI (WiX only takes numeric pre-release labels): publishing it reaches the beta
# channel only (beta-channel.yml), since GitHub's "latest" never points at a pre-release.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
      release: ${{ steps.check.outputs.release }}
      prerelease: ${{ steps.check.outputs.prerelease }}
      body: ${{ steps.notes.outputs.body }}
    steps:
      - uses: actions/checkout@v7
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node -p "require('./package.json').version")
          cargo_version=$(sed -n 's/^version = "\(.*\)"$/\1/p' src-tauri/Cargo.toml | head -1)
          if [ "$version" != "$cargo_version" ]; then
            echo "::error::package.json ($version) and src-tauri/Cargo.toml ($cargo_version) disagree; use pnpm bump"
            exit 1
          fi
          if ! echo "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-beta\.[0-9]+)?$'; then
            echo "::error::$version is neither X.Y.Z nor X.Y.Z-beta.N; use pnpm bump"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          case "$version" in
            *-*) echo "prerelease=true" >> "$GITHUB_OUTPUT" ;;
            *) echo "prerelease=false" >> "$GITHUB_OUTPUT" ;;
          esac
          # Drafts have no git tag yet, so ask the releases API (it sees drafts with this token).
          if gh release view "v$version" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "v$version already released; nothing to build"
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi
      # The release body (and latest.json's `notes`, which tauri-action takes from it): the
      # version's changelog in English, written in the bump PR, then where to download.
      - id: notes
        env:
          VERSION: ${{ steps.check.outputs.version }}
        run: |
          {
            echo "body<<RELEASE_NOTES_EOF"
            node scripts/release-notes.mjs "$VERSION"
            echo "RELEASE_NOTES_EOF"
          } >> "$GITHUB_OUTPUT"

  build:
    needs: version
    if: needs.version.outputs.release == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target aarch64-apple-darwin
            rust-targets: aarch64-apple-darwin
          - platform: macos-latest
            args: --target x86_64-apple-darwin
            rust-targets: x86_64-apple-darwin
          - platform: ubuntu-22.04
            args: ""
            rust-targets: ""
          - platform: windows-latest
            args: ""
            rust-targets: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7

      - name: Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: pnpm install --frozen-lockfile

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Code signing: on hold until the toolbox has more users or funding (see
          # docs/code-signing.md). Add the secrets, then uncomment to sign and notarize the
          # macOS builds. Windows signing goes through SignPath, set up separately.
          # APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          # APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          # APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          # APPLE_ID: ${{ secrets.APPLE_ID }}
          # APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          # APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        with:
          tagName: v${{ needs.version.outputs.version }}
          releaseCommitish: ${{ github.sha }}
          releaseName: Classroom 50 Toolbox v${{ needs.version.outputs.version }}
          releaseBody: ${{ needs.version.outputs.body }}
          releaseDraft: true
          prerelease: ${{ needs.version.outputs.prerelease == 'true' }}
          # Pre-releases: NSIS only on Windows. Their latest.json then has no
          # windows-x86_64-msi entry, and MSI installs never read the beta channel anyway
          # (updater.rs keeps them on stable).
          args: ${{ matrix.args }}${{ runner.os == 'Windows' && needs.version.outputs.prerelease == 'true' && ' --bundles nsis' || '' }}

  # tauri-action points latest.json at api.github.com asset URLs, which allow 60
  # unauthenticated requests an hour per IP: on a campus network every student shares one,
  # and the update download fails with 403. Point it at the release's download links
  # instead (they work once the draft is published under its tag).
  updater-urls:
    needs: [version, build]
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ needs.version.outputs.version }}
        run: |
          id=$(gh api "repos/$GITHUB_REPOSITORY/releases" --paginate \
            --jq ".[] | select(.tag_name == \"$TAG\") | .id")
          gh api "repos/$GITHUB_REPOSITORY/releases/$id/assets" --paginate > assets.json
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern latest.json
          jq --slurpfile assets assets.json \
            --arg base "https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/" '
            ($assets | add | map({key: .url, value: ($base + (.name | @uri))}) | from_entries) as $links
            | .platforms |= map_values(.url = ($links[.url] // error("no asset for \(.url)")))
          ' latest.json > latest.fixed.json
          mv latest.fixed.json latest.json
          cat latest.json
          gh release upload "$TAG" latest.json --clobber --repo "$GITHUB_REPOSITORY"
