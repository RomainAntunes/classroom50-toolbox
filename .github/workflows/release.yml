name: Release

# Runs on every merge into main, but only builds when package.json carries a version that
# has no release yet (bump it in the PR with `pnpm bump X.Y.Z`). The result is a draft
# release with installers and latest.json; publishing the draft ships the update to
# installed apps. A version like 0.11.0-beta.1 makes a draft pre-release instead, without
# the MSI (WiX only takes numeric pre-release labels): publishing it reaches the beta
# channel only (beta-channel.yml), since GitHub's "latest" never points at a pre-release.
# Builds: macOS Apple Silicon and Intel, Linux x64 and Arm64, Windows x64 and Arm64.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    permissions:
      # Write, not read: the releases API only shows drafts to a token that can push, and
      # the check below must see an unpublished draft of this version. Also creates it.
      contents: write
    outputs:
      version: ${{ steps.check.outputs.version }}
      release: ${{ steps.check.outputs.release }}
      prerelease: ${{ steps.check.outputs.prerelease }}
      body: ${{ steps.notes.outputs.body }}
      release-id: ${{ steps.draft.outputs.id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node -p "require('./package.json').version")
          cargo_version=$(sed -n 's/^version = "\(.*\)"$/\1/p' src-tauri/Cargo.toml | head -1)
          if [ "$version" != "$cargo_version" ]; then
            echo "::error::package.json ($version) and src-tauri/Cargo.toml ($cargo_version) disagree; use pnpm bump"
            exit 1
          fi
          if ! echo "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-beta\.[0-9]+)?$'; then
            echo "::error::$version is neither X.Y.Z nor X.Y.Z-beta.N; use pnpm bump"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          case "$version" in
            *-*) echo "prerelease=true" >> "$GITHUB_OUTPUT" ;;
            *) echo "prerelease=false" >> "$GITHUB_OUTPUT" ;;
          esac
          # Drafts have no git tag yet, so ask the releases API (it sees drafts with this token).
          # A draft with no assets is what a run whose builds all failed leaves: build into it
          # again, as if there were none. A published release, or a draft with assets, is done.
          if existing=$(gh release view "v$version" --repo "$GITHUB_REPOSITORY" --json isDraft,assets,databaseId 2> /dev/null); then
            empty_draft=$(echo "$existing" | jq -r 'if .isDraft and (.assets | length) == 0 then .databaseId else empty end')
            if [ -n "$empty_draft" ]; then
              echo "v$version has an empty draft ($empty_draft) from a failed run; building into it"
              echo "release=true" >> "$GITHUB_OUTPUT"
              echo "draft-id=$empty_draft" >> "$GITHUB_OUTPUT"
            else
              echo "v$version already released; nothing to build"
              echo "release=false" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi
      # The release body (and latest.json's `notes`, which tauri-action takes from it): the
      # version's changelog in English, written in the bump PR, then where to download.
      - id: notes
        env:
          VERSION: ${{ steps.check.outputs.version }}
        run: |
          {
            echo "body<<RELEASE_NOTES_EOF"
            node scripts/release-notes.mjs "$VERSION"
            echo "RELEASE_NOTES_EOF"
          } >> "$GITHUB_OUTPUT"
      # The draft every leg uploads to, made once here: tauri-action would otherwise look for
      # it after each build and create it when missing, and two legs finishing together could
      # make two drafts for one tag. An empty draft left by a failed run is reused, moved to
      # this commit with this run's name, body and pre-release flag.
      - id: draft
        if: steps.check.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.check.outputs.version }}
          PRERELEASE: ${{ steps.check.outputs.prerelease }}
          DRAFT_ID: ${{ steps.check.outputs.draft-id }}
        run: |
          node scripts/release-notes.mjs "$VERSION" > notes.md
          if [ -n "$DRAFT_ID" ]; then
            method=PATCH endpoint="repos/$GITHUB_REPOSITORY/releases/$DRAFT_ID"
          else
            method=POST endpoint="repos/$GITHUB_REPOSITORY/releases"
          fi
          id=$(gh api --method "$method" "$endpoint" \
            -f tag_name="v$VERSION" -f target_commitish="$GITHUB_SHA" \
            -f name="Classroom 50 Toolbox v$VERSION" -F body=@notes.md \
            -F draft=true -F prerelease="$PRERELEASE" --jq .id)
          echo "Draft release $id ($method) for v$VERSION at $GITHUB_SHA"
          echo "id=$id" >> "$GITHUB_OUTPUT"

  build:
    needs: version
    if: needs.version.outputs.release == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target aarch64-apple-darwin
            rust-targets: aarch64-apple-darwin
          - platform: macos-latest
            args: --target x86_64-apple-darwin
            rust-targets: x86_64-apple-darwin
          - platform: ubuntu-22.04
            args: ""
            rust-targets: ""
          # Native Arm runner, on the same Ubuntu (and glibc) as the x64 build.
          - platform: ubuntu-22.04-arm
            args: ""
            rust-targets: ""
          - platform: windows-latest
            args: ""
            rust-targets: ""
          # Cross-compiled on the x64 image, as Tauri documents it (its Visual Studio has the
          # ARM64 build tools); NSIS and WiX themselves run x64.
          - platform: windows-latest
            args: --target aarch64-pc-windows-msvc
            rust-targets: aarch64-pc-windows-msvc
    runs-on: ${{ matrix.platform }}
    # The updater signing key is a secret of the `release` environment, which only main can
    # deploy to, so a run started by hand on another branch can't sign anything.
    environment: release
    permissions:
      # tauri-action uploads the installers and latest.json to the draft.
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # xdg-utils: the AppImage bundles xdg-open. The x64 image has it already; the Arm one
      # may not.
      - name: Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf xdg-utils

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
          cache: pnpm
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: ${{ matrix.rust-targets }}
      - uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri
          # Legs on the same runner image build different targets: one cache each.
          key: ${{ matrix.rust-targets }}

      - run: pnpm install --frozen-lockfile

      - uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Code signing: on hold until the toolbox has more users or funding (see
          # docs/code-signing.md). Add the secrets, then uncomment to sign and notarize the
          # macOS builds. Windows signing goes through SignPath, in the `sign-windows` job
          # below, after the build.
          # APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          # APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          # APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          # APPLE_ID: ${{ secrets.APPLE_ID }}
          # APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          # APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        with:
          # The draft the version job made (tag, name, body, pre-release): with an id,
          # tauri-action only uploads to it and never creates a release.
          releaseId: ${{ needs.version.outputs.release-id }}
          # Only for latest.json's `notes` here; the draft already has this body.
          releaseBody: ${{ needs.version.outputs.body }}
          # Pre-releases: NSIS only on Windows. Their latest.json then has no
          # windows-x86_64-msi entry, and MSI installs never read the beta channel anyway
          # (updater.rs keeps them on stable).
          args: ${{ matrix.args }}${{ runner.os == 'Windows' && needs.version.outputs.prerelease == 'true' && ' --bundles nsis' || '' }}

  # tauri-action points latest.json at api.github.com asset URLs, which allow 60
  # unauthenticated requests an hour per IP: on a campus network every student shares one,
  # and the update download fails with 403. Point it at the release's download links
  # instead (they work once the draft is published under its tag). An entry already pointing
  # at one of those links is kept, so re-running this job alone is safe.
  updater-urls:
    needs: [version, build]
    runs-on: ubuntu-latest
    permissions:
      # Reads the draft's assets and uploads the rewritten latest.json.
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ needs.version.outputs.version }}
          PRERELEASE: ${{ needs.version.outputs.prerelease }}
          RELEASE_ID: ${{ needs.version.outputs.release-id }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets" --paginate > assets.json
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern latest.json
          jq --slurpfile assets assets.json \
            --arg base "https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/" '
            ($assets | add | map({key: .url, value: ($base + (.name | @uri))}) | from_entries) as $links
            | [$links[]] as $rewritten
            | .platforms |= map_values(.url as $url | .url = ($links[$url]
                // if any($rewritten[]; . == $url) then $url else error("no asset for \($url)") end))
          ' latest.json > latest.fixed.json
          mv latest.fixed.json latest.json
          cat latest.json
          # Every leg adds its entries to the same file; refuse a feed missing one, which
          # would leave those installs without updates (scripts/updater-platforms.mjs). Two
          # legs merging the file at once can drop one's entries: re-run that leg's build
          # job, which uploads them again and runs this job after it.
          node scripts/updater-platforms.mjs latest.json "$PRERELEASE"
          gh release upload "$TAG" latest.json --clobber --repo "$GITHUB_REPOSITORY"

  # Windows code signing through SignPath Foundation: on hold until the project is accepted
  # (docs/code-signing.md has the plan and the checklist). To switch it on: add the secret
  # SIGNPATH_API_TOKEN and the variable SIGNPATH_ORGANIZATION_ID, uncomment this job, and add
  # `sign-windows` to the `needs` of `installer-sizes` so it measures the signed installers.
  #
  # It runs after `updater-urls`, which has turned latest.json's links into name-based
  # download links (replacing an asset changes its API id, not its name). SignPath signs the
  # installers tauri-action uploaded; Authenticode changes their bytes, so each one is signed
  # again with the updater key and latest.json gets the new signatures. Every job up to the
  # signing request runs on GitHub-hosted runners, as SignPath's origin verification requires.
  #
  # sign-windows:
  #   needs: [version, updater-urls]
  #   runs-on: ubuntu-latest
  #   # The updater key, to sign the signed installers again.
  #   environment: release
  #   permissions:
  #     # Downloads and replaces the draft's assets.
  #     contents: write
  #     # SignPath's action reads the uploaded workflow artifact.
  #     actions: read
  #   steps:
  #     - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
  #       with:
  #         persist-credentials: false
  #     - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
  #     - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
  #       with:
  #         node-version: lts/*
  #         package-manager-cache: false
  #     # For `tauri signer`, at the version the build used.
