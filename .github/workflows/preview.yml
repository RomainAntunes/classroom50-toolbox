name: Preview build

# Test installers for a branch, without a release: push it as `preview/<name>`
# (`git push origin HEAD:preview/<name>`) and download them from the run's artifacts. They
# carry no updater signature, so an install never updates itself to a preview.
on:
  push:
    branches: ["preview/**"]
  workflow_dispatch:

concurrency:
  group: preview-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            bundles: nsis
            target: ""
          - platform: macos-latest
            bundles: dmg
            target: ""
          # Windows on Arm's MSI: betas ship NSIS only, so release.yml first builds it for a
          # stable. Run this workflow by hand once before a stable that changes the Windows
          # build (WiX, the toolchain, a crate cross-compiling C) to catch a failure early.
          - platform: windows-latest
            bundles: msi
            target: aarch64-pc-windows-msvc
    runs-on: ${{ matrix.platform }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
          cache: pnpm
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: ${{ matrix.target }}
      - uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri
          # The two Windows legs build different targets: one cache each.
          key: ${{ matrix.target }}

      - run: pnpm install --frozen-lockfile
      - run: pnpm tauri build ${TARGET:+--target "$TARGET"} --bundles "$BUNDLES" --config '{"bundle":{"createUpdaterArtifacts":false}}'
        shell: bash
        env:
          BUNDLES: ${{ matrix.bundles }}
          TARGET: ${{ matrix.target }}

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: classroom50-toolbox-${{ runner.os }}${{ matrix.target && format('-{0}', matrix.target) || '' }}
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/aarch64-pc-windows-msvc/release/bundle/msi/*.msi
          if-no-files-found: error
